name: OB/FVG Scanner
on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 3-10 * * 1-5"
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - name: Refresh NSE universe
        run: python universe_builder.py
      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py
      - name: Commit universe and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add universe.csv state.json
          git diff --cached --quiet || git commit -m "Refresh universe and scanner state"
          git push
          
