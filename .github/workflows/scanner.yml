name: SharQ Fx OB Reports

on:
  workflow_dispatch:
  schedule:
    # 10:00 AM IST = 04:30 UTC, Monday-Friday
    - cron: "30 4 * * 1-5"
    # 04:00 PM IST = 10:30 UTC, Monday-Friday
    - cron: "30 10 * * 1-5"

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Refresh NSE + BSE universe
        run: python universe_builder.py
      - name: Generate and send SharQ Fx reports
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
            TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
        run: python scanner.py
      - name: Commit refreshed universe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add universe.csv
          git diff --cached --quiet || git commit -m "Refresh stock universe"
          git push
